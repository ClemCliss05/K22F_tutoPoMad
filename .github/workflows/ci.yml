name: CI Firmware

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  analysis:
    name: Static Analysis + Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            ninja-build \
            clang \
            clang-tidy \
            clang-format \
            cppcheck

      - name: Check formatting
        run: ./scripts/clang-format.sh --check

      - name: Run clang-tidy
        run: ./scripts/clang-tidy.sh

      - name: Run tests
        run: ./scripts/build.sh test

      - name: Run cppcheck
        run: ./scripts/cppcheck.sh


  firmware:
    name: Firmware Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            cmake \
            ninja-build

      - name: Build firmware
        run: ./scripts/build.sh

      - name: Firmware size
        run: arm-none-eabi-size build/build_firmware/*.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/build_firmware/*.elf
            build/build_firmware/*.bin
            build/build_firmware/*.hex